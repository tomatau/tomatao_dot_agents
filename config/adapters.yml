claude:
  personalisation:
    - dest: '~/.claude/CLAUDE.md'
      target: dist/claude/CLAUDE.md
  skills:
    - dest: '~/.claude/skills/'
      target: skills/
  mcp:
    scope: user
    enable: [shared-memory, project-memory, leann]

codex:
  personalisation:
    - dest: '~/.codex/AGENTS.md'
      target: dist/codex/AGENTS.md
  skills: native
  mcp:
    home: '~/.codex'
    enable: [shared-memory, project-memory, leann]

opencode:
  personalisation:
    - dest: '~/.config/opencode/AGENTS.md'
      target: dist/opencode/AGENTS.md
  skills: native
  mcp:
    file: '~/.config/opencode/opencode.jsonc'
    enable: [shared-memory, project-memory, leann]

zed:
  personalisation:
    - dest: '~/.config/zed/AGENTS.md'
      target: dist/zed/AGENTS.md
  skills: native
  mcp:
    file: '~/.config/zed/settings.json'
    enable: [shared-memory, project-memory, leann]

cursor:
  personalisation:
    - dest: '~/.cursor/rules/'
      target: dist/cursor/rules/
  skills:
    - dest: '~/.cursor/skills/'
      target: skills/
  mcp:
    file: '~/.cursor/mcp.json'
    enable: [shared-memory, project-memory, leann]

warp:
  personalisation:
    - dest: '~/.agents/AGENTS.md'
      target: dist/warp/AGENTS.md
  mcp:
    file: '~/.warp/.mcp.json'
    enable: [shared-memory, project-memory, leann]
