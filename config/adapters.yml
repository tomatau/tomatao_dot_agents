claude:
  personalisation:
    - dest: '~/.claude/CLAUDE.md'
      target: dist/claude/CLAUDE.md
  skills:
    - dest: '~/.claude/skills/'
      target: skills/
  mcp:
    scope: user
    enable: [shared-memory, project-memory, shared-search]

codex:
  personalisation:
    - dest: '~/.codex/AGENTS.md'
      target: dist/codex/AGENTS.md
  skills: native
  mcp:
    home: '~/.codex'
    enable: [shared-memory, project-memory, shared-search]

opencode:
  personalisation:
    - dest: '~/.config/opencode/AGENTS.md'
      target: dist/opencode/AGENTS.md
  skills: native
  mcp:
    file: '~/.config/opencode/opencode.jsonc'
    enable: [shared-memory, project-memory, shared-search]

zed:
  personalisation:
    - dest: '~/.config/zed/AGENTS.md'
      target: dist/zed/AGENTS.md
  skills: native
  mcp:
    file: '~/.config/zed/settings.json'
    enable: [shared-memory, project-memory, shared-search]

cursor:
  personalisation:
    - dest: '~/.cursor/rules/'
      target: dist/cursor/rules/
  skills:
    - dest: '~/.cursor/skills/'
      target: skills/
  mcp:
    file: '~/.cursor/mcp.json'
    enable: [shared-memory, project-memory, shared-search]

warp:
  personalisation:
    - dest: '~/.agents/AGENTS.md'
      target: dist/warp/AGENTS.md
  mcp:
    file: '~/.warp/.mcp.json'
    enable: [shared-memory, project-memory, shared-search]

antigravity:
  personalisation:
    - dest: '~/.gemini/config/AGENTS.md'
      target: dist/antigravity/AGENTS.md
  skills: native
  mcp:
    file: '~/.gemini/config/mcp_config.json'
    enable: [shared-memory, project-memory, shared-search]

pi:
  personalisation:
    - dest: '~/.pi/agent/AGENTS.md'
      target: dist/pi/AGENTS.md
  skills: native
  mcp:
    file: '~/.pi/agent/mcp.json'
    enable: [shared-memory, project-memory, shared-search]
