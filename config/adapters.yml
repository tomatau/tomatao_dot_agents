claude:
  personalisation:
    - dest: '~/.claude/CLAUDE.md'
      target: dist/claude/CLAUDE.md
  skills:
    - dest: '~/.claude/skills/'
      target: skills/
  mcp:
    scope: user
    enable: [hindsight]

codex:
  personalisation:
    - dest: '~/.codex/AGENTS.md'
      target: dist/codex/AGENTS.md
  skills: native
  mcp:
    home: '~/.codex'
    enable: [hindsight]

opencode:
  personalisation:
    - dest: '~/.config/opencode/AGENTS.md'
      target: dist/opencode/AGENTS.md
  skills: native
  mcp:
    enable: [hindsight]

zed:
  personalisation:
    - dest: '~/.config/zed/AGENTS.md'
      target: dist/zed/AGENTS.md
  skills: native
  mcp:
    enable: [hindsight]

cursor:
  personalisation:
    - dest: '~/.cursor/rules/'
      target: dist/cursor/rules/
  skills:
    - dest: '~/.cursor/skills/'
      target: skills/
  mcp:
    enable: [hindsight]
